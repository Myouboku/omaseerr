# A real Seerr to check the plugin against, with a media server for Seerr's
# setup wizard and the *arr apps the approval form reads from.
#
#   docker compose -f dev/compose.yaml up -d
#
# Then:
#   1. Jellyfin  http://localhost:8096  create an admin user (an empty library is fine)
#   2. Radarr    http://localhost:7878  and Sonarr http://localhost:8989:
#                add a root folder (/movies, /tv), note each API key (Settings > General)
#   3. Seerr     http://localhost:5055  sign in with Jellyfin (http://jellyfin:8096),
#                add Radarr (http://radarr:7878) and Sonarr (http://sonarr:8989),
#                copy the API key from Settings > General
#   4. Make a couple of non-admin users in Seerr and request things as them.
#
# Point the plugin at http://localhost:5055 and paste the key in its settings.

name: omaseerr-dev

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    environment:
      - TZ=Europe/Paris
      - LOG_LEVEL=info
    ports:
      - "127.0.0.1:5055:5055"
    volumes:
      - seerr-config:/app/config
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    ports:
      - "127.0.0.1:8096:8096"
    volumes:
      - jellyfin-config:/config
      - media:/media
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - radarr-config:/config
      - media:/movies
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - sonarr-config:/config
      - media:/tv
    restart: unless-stopped

volumes:
  seerr-config:
  jellyfin-config:
  radarr-config:
  sonarr-config:
  media:
